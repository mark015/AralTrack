<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102452">
    <title>Offline · AralTrack</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; background: #f4f6fb; color: #1b2540; padding: 16px; box-sizing: border-box; }
        .card { max-width: 380px; width: 100%; background: #fff; border: 1px solid #e4e8f1; border-radius: 16px; padding: 32px 24px; text-align: center; box-shadow: 0 18px 40px -18px rgba(16, 24, 40, .35); }
        h1 { font-size: 1.3rem; margin: 16px 0 6px; }
        p { color: #667085; margin: 0 0 20px; }
        button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 22px; background: #2a4fd6; color: #fff; cursor: pointer; }
        @media (prefers-color-scheme: dark) {
            body { background: #0b1222; color: #e6e9f2; }
            .card { background: #141c30; border-color: #26304a; }
            p { color: #9aa4bd; }
        }
        .teachers { margin: 22px 0 0; font-size: .92rem; }
        .teachers a { display: inline-block; margin-top: 8px; font-weight: 600; color: #2a4fd6; }
    </style>
</head>
<body>
<div class="card">
    <svg width="64" height="64" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 34.5 7.2v10.6c0 9.6-6.1 16.9-14.5 20.2C11.6 34.7 5.5 27.4 5.5 17.8V7.2z" fill="#f5b82e"/><path d="M20 5.6 31.3 9.6v8.3c0 7.6-4.6 13.5-11.3 16.6-6.7-3.1-11.3-9-11.3-16.6V9.6z" fill="#102452"/><path d="M11.5 16 20 12.2 28.5 16 20 19.8z" fill="#f5b82e"/><path d="M14.8 18.4v4.3c0 1.7 2.3 3 5.2 3s5.2-1.3 5.2-3v-4.3L20 20.7z" fill="#fff"/><path d="M28.5 16v5.2" stroke="#f5b82e" stroke-width="1.4" stroke-linecap="round"/><circle cx="28.5" cy="22" r="1.2" fill="#f5b82e"/></svg>
    <h1>You're offline</h1>
    <p>The portal needs an internet or school network connection to show grades and attendance. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="teachers">Teachers: you can still take class attendance.<br>
        <a href="offline-attendance.html">Take attendance offline</a></p>
</div>
</body>
</html>
